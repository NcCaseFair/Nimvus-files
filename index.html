<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="#">
    <title>weather</title>
</head>
<body>
    <div class="container">
        <div class="search-box">
            <img src="./images/icons8-location-48.png" alt="bxs-map">
            <input type="text" placeholder="enter your location" name="location" id="nimvus">
            <button><img src="./images/icons8-results-found-48.png" alt="bx-search"></button>
        </div>

        <div class="weather-box">
            <div class="box">
                <div class="info-weather">
                    <div class="weather">
                        <img src="./images/icons8-partly-cloudy-day-48.png" alt="bxs">
                        <p class="temperature">0<span>℃</span></p>
                        <p class="description">Broken Clouds</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="not-found">
            <div class="box">
                <img src="./images/icons8-window-search-48.png" alt="bxs-not">
                <p>Oops! Location not found</p>
            </div>
        </div>
        <div class="weather-details">
            <div class="humidity">
                <img src="./images/icons8-dry-48.png" alt="bx-dry">
                <div class="text">
                    <div class="info-humidity">
                        <span>0%</span>
                    </div>
                    <p>Humidity</p>
                </div>
            </div>
         <div class="wind">
                <img src="./images/icons8-wind-48.png" alt="bxs-wind">
                <div class="text">
                    <div class="info-wind">
                        <span>0฿m/h</span>
                    </div>
                    <p>Wind Speed</p>
        </div>
    </div>

    <script src="#"></script>
</body>
</html>
